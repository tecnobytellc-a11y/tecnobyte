<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TecnoByte - La Comodidad de Comprar en Casa</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <meta name="darkreader-lock">
    
    <!-- SEO & Schema Markup (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Store",
      "name": "TecnoByte LLC",
      "image": "https://tecnobyte.com/logo.png",
      "description": "El marketplace definitivo para gamers. Recargas, Gift Cards de Amazon, números virtuales y exchange automatizado.",
      "url": "https://www.tecnobyte.lat",
      "telephone": "+19047400467",
      "priceRange": "$",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Digital",
        "addressCountry": "US"
      }
    }
    </script>
  </head>
  <body class="bg-[#0b0e14]">
    <div id="root"></div>
  </body>
</html>
